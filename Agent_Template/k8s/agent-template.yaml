apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-template
  labels:
    app: agent-template
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-template
  template:
    metadata:
      labels:
        app: agent-template
    spec:
      containers:
        - name: agent-template
          image: agent-template:0.1.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9001
              name: http
          env:
            - name: A2A_AGENT_URL
              value: http://192.168.49.2:30091
            - name: NATS_SERVER_URL
              value: nats://nats:4222
            - name: NATS_IN_SUBJECT
              value: workflow.previousagent.result
            - name: NATS_IN_DURABLE
              value: workflow-previousagent-result
            - name: NATS_OUT_SUBJECT
              value: workflow.agenttemplate.result
            - name: AGENT_MAX_CONCURRENT_TASKS
              value: "1"
            - name: AGENT_ID
              value: agent-template
            - name: INSTANCE_ID
              value: agent-template-instance-1

---
apiVersion: v1
kind: Service
metadata:
  name: agent-template
  labels:
    app: agent-template
spec:
  selector:
    app: agent-template
  ports:
    - name: http
      protocol: TCP
      port: 9001
      nodePort: 30091
      targetPort: 9001
  type: NodePort
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: agent-template
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app: agent-template
  endpoints:
    - port: http
      path: /metrics/
      interval: 15s
      scrapeTimeout: 10s
