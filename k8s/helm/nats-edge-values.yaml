config:
  merge:
    max_payload: 67108864

  leafnodes:
    enabled: true
    merge:
      remotes:
        - urls:
            - nats://leaf:change-me-leaf-password@CHANGE_ME_CLOUD_HOST:7422
          deny_imports:
            - "workflow.local.>"
            - "frame.local.>"
          deny_exports:
            - "workflow.local.>"
            - "frame.local.>"

  monitor:
    enabled: true

  jetstream:
    enabled: true
    merge:
      domain: CHANGE_ME_EDGE_DOMAIN
    fileStore:
      enabled: true
      pvc:
        enabled: true
        size: 10Gi
    memoryStore:
      enabled: true
      # Shared capacity for all memory-backed streams on this NATS server.
      maxSize: 1Gi

service:
  merge:
    spec:
      type: ClusterIP

container:
  image:
    registry: docker.m.daocloud.io

reloader:
  image:
    registry: docker.m.daocloud.io

natsBox:
  enabled: true
  container:
    image:
      registry: docker.m.daocloud.io

promExporter:
  enabled: false
