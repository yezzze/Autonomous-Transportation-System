config:
  merge:
    max_payload: 67108864

  cluster:
    enabled: true
    replicas: 3

  jetstream:
    enabled: true
    fileStore:
      pvc:
        enabled: true
        # Capacity for Hub metadata/legacy streams; instance Streams live at edges.
        size: 10Gi
    memoryStore:
      enabled: true
      # Shared capacity for cloud-hosted memory-backed frame Streams.
      maxSize: 1Gi
    merge:
      domain: hub
      # Optional server-wide cap (all streams); stream limits are set in app/CLI, not Helm
      # max_file: << 20GB >>

  leafnodes:
    enabled: true
    port: 7422
    merge:
      authorization:
        user: leaf
        password: change-me-leaf-password

  monitor:
    enabled: true

container:
  image:
    registry: docker.m.daocloud.io
  merge:
    # TODO(next update): max_memory_store is 1Gi, so a 1Gi container limit leaves
    # no headroom for NATS runtime, connections, and network buffers. Raise the
    # container limit to at least 1.5-2Gi before enabling concurrent frame flows.
    resources:
      requests:
        cpu: "500m"
        memory: 1Gi
      limits:
        cpu: "500m"
        memory: 1Gi

reloader:
  image:
    registry: docker.m.daocloud.io

natsBox:
  enabled: true
  container:
    image:
      registry: docker.m.daocloud.io

service:
  merge:
    spec:
      type: NodePort
      ports:
        - name: nats
          port: 4222
          targetPort: nats
          nodePort: 30422
        - name: leafnodes
          port: 7422
          targetPort: leafnodes
          nodePort: 30472
        - name: monitor
          port: 8222
          targetPort: monitor
          nodePort: 30482

promExporter:
  enabled: true
  image:
    registry: docker.m.daocloud.io
