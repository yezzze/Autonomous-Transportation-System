apiVersion: apps/v1
kind: Deployment
metadata:
  name: simlingo-encoder-agent
  labels:
    app: simlingo-encoder-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simlingo-encoder-agent
  template:
    metadata:
      labels:
        app: simlingo-encoder-agent
    spec:
      containers:
        - name: simlingo-encoder-agent
          image: simlingo-encoder-agent:0.3.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9011
              name: http
          env:
            - name: A2A_AGENT_URL
              value: http://192.168.49.2:30121
            - name: NATS_SERVER_URL
              value: nats://nats:4222
            - name: MCP_SERVER_HOST
              value: 10.112.93.73
            - name: MCP_SERVER_PORT
              value: "8124"
            - name: MCP_SERVER_ENDPOINT
              value: /mcp
            - name: MCP_FRAME_RESOURCE_URI
              value: bench2drive://frame/current
            - name: ENCODER_MODEL_VARIANT
              value: /app/models/InternVL2-1B
            - name: ENCODER_CHECKPOINT_PATH
              value: /app/checkpoints/simlingo_encoder/pytorch_model.bin
            - name: ENCODER_TOKEN_PRUNE_MODE
              value: prune2drive
              # value: origin
            - name: ENCODER_TOKEN_PRUNE_RATIO
              value: "0.3"
              # value: "0.0"
            - name: ENCODER_TOKEN_PRUNE_MIN_KEEP
              value: "1"
            - name: AGENT_MAX_CONCURRENT_TASKS
              value: "1"
            # 工作流路由使用的集群标识；需与发送方使用的 target_cluster 一致。
            - name: CLUSTER_ID
              value: edge-c
            # Agent 逻辑标识；同一种 Agent 的所有副本应使用相同值。
            - name: AGENT_ID
              value: simlingo-encoder-agent
            # 每个 Pod 使用独立实例标识，从而创建独享的 WF_<instance-id> Stream。
            - name: AGENT_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: NATS_CONTROL_MAX_BYTES
              value: "67108864"
          resources:
            requests:
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"

---
apiVersion: v1
kind: Service
metadata:
  name: simlingo-encoder-agent
  labels:
    app: simlingo-encoder-agent
spec:
  selector:
    app: simlingo-encoder-agent
  ports:
    - name: http
      protocol: TCP
      port: 9011
      nodePort: 30121
      targetPort: 9011
  type: NodePort
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: simlingo-encoder-agent
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app: simlingo-encoder-agent
  endpoints:
    - port: http
      path: /metrics/
      interval: 15s
      scrapeTimeout: 10s
