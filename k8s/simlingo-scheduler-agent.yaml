apiVersion: apps/v1
kind: Deployment
metadata:
  name: simlingo-scheduler-agent
  labels:
    app: simlingo-scheduler-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simlingo-scheduler-agent
  template:
    metadata:
      labels:
        app: simlingo-scheduler-agent
    spec:
      containers:
        - name: simlingo-scheduler-agent
          image: simlingo-scheduler-agent:0.3.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9013
              name: http
          env:
            - name: A2A_AGENT_URL
              value: http://192.168.49.2:30123
            - name: NATS_SERVER_URL
              value: nats://nats:4222
            - name: SCHEDULER_MODEL_VARIANT
              value: /app/models/InternVL2-1B
            - name: SCHEDULER_CHECKPOINT_PATH
              value: /app/checkpoints/simlingo_scheduler/pytorch_model.bin
            - name: SCHEDULER_MODE
              value: fixed
            - name: SCHEDULER_FIXED_BUDGET
              value: "1.0"
            - name: SCHEDULER_HISTORY_ALPHA
              value: "0.6"
            - name: SCHEDULER_DECISION_SHIFT_T_LAP
              value: "0.2"
            - name: SCHEDULER_TARGET
              value: simlingo_adaption_training.models.scheduler.simple_scheduler.SimpleScheduler_L
            - name: SCHEDULER_TAU
              value: "5"
            - name: SCHEDULER_IS_HARD
              value: "true"
            - name: SCHEDULER_THRESHOLD
              value: "0.5"
            - name: SCHEDULER_BIAS
              value: "true"
            - name: SCHEDULER_NUM_PREFIX_LAYERS
              value: "10"
            - name: SIMLINGO_EVAL_RECORD_TFLOPS
              value: "1"
            - name: AGENT_MAX_CONCURRENT_TASKS
              value: "1"
            # 工作流路由使用的集群标识；需与发送方使用的 target_cluster 一致。
            - name: CLUSTER_ID
              value: edge-c
            # Agent 逻辑标识；同一种 Agent 的所有副本应使用相同值。
            - name: AGENT_ID
              value: simlingo-scheduler-agent
            # 每个 Pod 使用 UID 作为实例标识，创建独享的 WF_<instance-id> Stream。
            - name: AGENT_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: NATS_CONTROL_MAX_BYTES
              value: "67108864"
          resources:
            requests:
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"

---
apiVersion: v1
kind: Service
metadata:
  name: simlingo-scheduler-agent
  labels:
    app: simlingo-scheduler-agent
spec:
  selector:
    app: simlingo-scheduler-agent
  ports:
    - name: http
      protocol: TCP
      port: 9013
      nodePort: 30123
      targetPort: 9013
  type: NodePort

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: simlingo-scheduler-agent
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app: simlingo-scheduler-agent
  endpoints:
    - port: http
      path: /metrics/
      interval: 15s
      scrapeTimeout: 10s
