apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-app
  labels:
    app: external-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: external-app
  template:
    metadata:
      labels:
        app: external-app
    spec:
      nodeSelector:
        kubernetes.io/hostname: "<filled-by-orchestrator>"
      containers:
        - name: external-app
          image: "<filled-by-orchestrator>"
          imagePullPolicy: IfNotPresent
          env:
            - name: NATS_SERVERS
              value: "nats://nats:4222"
            - name: NATS_JETSTREAM_DOMAIN
              value: "hub"
            - name: NATS_STREAM_SUBJECTS
              value: "workflow.>"
            - name: NATS_BINARY_MAX_BYTES
              value: "67108864"
            - name: NATS_PENDING_SIZE_BYTES
              value: "134217728"
            - name: NATS_BINARY_PENDING_BYTES
              value: "134217728"
            - name: NATS_BINARY_PENDING_MSGS
              value: "32"
            - name: CLUSTER_ID
              value: "<filled-by-orchestrator>"
            - name: FRAME_UPLOAD_TARGET
              value: "<frame-service-ip-or-dns>:30051"
            - name: FRAME_ALLOWED_TARGETS
              value: "<frame-service-ip-or-dns>:30051"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
              nvidia.com/gpu: "0"
