apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-app
  labels:
    app: external-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: external-app
  template:
    metadata:
      labels:
        app: external-app
    spec:
      nodeSelector:
        kubernetes.io/hostname: "<filled-by-orchestrator>"
      containers:
        - name: external-app
          image: "<filled-by-orchestrator>"
          imagePullPolicy: IfNotPresent
          env:
            - name: NATS_SERVERS
              value: "nats://nats:4222"
            - name: NATS_JETSTREAM_DOMAIN
              value: "<filled-by-orchestrator>"
            - name: NATS_WORKFLOW_STREAM_PREFIX
              value: "WF"
            - name: NATS_FRAME_STREAM_PREFIX
              value: "FRAME"
            - name: NATS_FRAME_STREAM_MAX_BYTES
              value: "512MiB"
            - name: NATS_FRAME_STREAM_MAX_AGE_SEC
              value: "120"
            - name: NATS_FRAME_ACK_WAIT_SEC
              value: "60"
            - name: NATS_FRAME_MAX_DELIVER
              value: "3"
            - name: NATS_STREAM_MAX_BYTES
              value: "512MiB"
            - name: NATS_STREAM_DISCARD
              value: "new"
            - name: NATS_STREAM_RETENTION
              value: "workqueue"
            - name: NATS_BINARY_MAX_BYTES
              value: "67108864"
            - name: NATS_PENDING_SIZE_BYTES
              value: "134217728"
            - name: NATS_BINARY_PENDING_BYTES
              value: "134217728"
            - name: NATS_BINARY_PENDING_MSGS
              value: "32"
            - name: CLUSTER_ID
              value: "<filled-by-orchestrator>"
            - name: AGENT_ID
              value: "<filled-by-orchestrator>"
            - name: AGENT_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NATS_STREAM_PROVISION_TIMEOUT_SEC
              value: "120"
            - name: FRAME_UPLOAD_TARGET
              value: "<frame-service-ip-or-dns>:30051"
            - name: FRAME_ALLOWED_TARGETS
              value: "<frame-service-ip-or-dns>:30051"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
              nvidia.com/gpu: "0"
