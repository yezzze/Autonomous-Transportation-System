apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-template
  labels:
    app: agent-template
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-template
  template:
    metadata:
      labels:
        app: agent-template
    spec:
      containers:
        - name: agent-template
          image: agent-template:0.2.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9001
              name: http
          env:
            - name: A2A_AGENT_URL
              value: http://192.168.49.2:30091
            - name: AGENT_MAX_CONCURRENT_TASKS
              value: "1"
            # 工作流路由使用的集群标识；需与发送方使用的 target_cluster 一致。
            - name: CLUSTER_ID
              value: edge-c
            # Agent 逻辑标识；同一种 Agent 的所有副本应使用相同值。
            - name: AGENT_ID
              value: agent-template
            # 每个 Pod 使用独立实例标识，从而创建独享的 WF_<instance-id> Stream。
            - name: AGENT_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid

---
apiVersion: v1
kind: Service
metadata:
  name: agent-template
  labels:
    app: agent-template
spec:
  selector:
    app: agent-template
  ports:
    - name: http
      protocol: TCP
      port: 9001
      nodePort: 30091
      targetPort: 9001
  type: NodePort
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: agent-template
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app: agent-template
  endpoints:
    - port: http
      path: /metrics/
      interval: 15s
      scrapeTimeout: 10s
