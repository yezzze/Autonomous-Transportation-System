apiVersion: apps/v1
kind: Deployment
metadata:
  name: simlingo-llm-agent
  labels:
    app: simlingo-llm-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simlingo-llm-agent
  template:
    metadata:
      labels:
        app: simlingo-llm-agent
    spec:
      containers:
        - name: simlingo-llm-agent
          image: simlingo-llm-agent:0.3.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9012
              name: http
          env:
            - name: A2A_AGENT_URL
              value: http://192.168.49.2:30122
            - name: NATS_SERVER_URL
              value: nats://nats:4222
            - name: MCP_SERVER_HOST
              value: 10.112.93.73
            - name: MCP_SERVER_PORT
              value: "8124"
            - name: MCP_SERVER_PROTOCOL
              value: http
            - name: MCP_SERVER_ENDPOINT
              value: /mcp
            - name: LLM_MODEL_VARIANT
              value: /app/models/InternVL2-1B
            - name: LLM_CHECKPOINT_PATH
              value: /app/checkpoints/simlingo_llm/pytorch_model.bin
            - name: LLM_SPEED_WPS_MODE
              value: 2d
            - name: LLM_PREDICT_ROUTE_AS_WPS
              value: "true"
            - name: LLM_LORA
              value: "true"
            - name: LLM_ADAPTION_TRAIN
              value: "true"
            - name: LLM_LORA_ALPHA
              value: "64"
            - name: LLM_LORA_R
              value: "32"
            - name: LLM_LORA_DROPOUT
              value: "0.1"
            - name: LLM_NUM_PREFIX_LAYERS
              value: "10"
            - name: LLM_SCHEDULER_NUM_PREFIX_LAYERS
              value: "10"
            - name: LLM_SCHEDULER_TARGET
              value: simlingo_adaption_training.models.scheduler.simple_scheduler.SimpleScheduler_L
            - name: LLM_SCHEDULER_TAU
              value: "5"
            - name: LLM_SCHEDULER_IS_HARD
              value: "true"
            - name: LLM_SCHEDULER_THRESHOLD
              value: "0.5"
            - name: LLM_SCHEDULER_BIAS
              value: "true"
            - name: SIMLINGO_EVAL_RECORD_TFLOPS
              value: "1"
            - name: AGENT_MAX_CONCURRENT_TASKS
              value: "1"
            # 工作流路由使用的集群标识；需与发送方使用的 target_cluster 一致。
            - name: CLUSTER_ID
              value: edge-c
            # Agent 逻辑标识；同一种 Agent 的所有副本应使用相同值。
            - name: AGENT_ID
              value: simlingo-llm-agent
            # 每个 Pod 使用 UID 作为实例标识，创建独享的 WF_<instance-id> Stream。
            - name: AGENT_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: NATS_CONTROL_MAX_BYTES
              value: "67108864"
          resources:
            requests:
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"

---
apiVersion: v1
kind: Service
metadata:
  name: simlingo-llm-agent
  labels:
    app: simlingo-llm-agent
spec:
  selector:
    app: simlingo-llm-agent
  ports:
    - name: http
      protocol: TCP
      port: 9012
      nodePort: 30122
      targetPort: 9012
  type: NodePort

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: simlingo-llm-agent
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app: simlingo-llm-agent
  endpoints:
    - port: http
      path: /metrics/
      interval: 15s
      scrapeTimeout: 10s
