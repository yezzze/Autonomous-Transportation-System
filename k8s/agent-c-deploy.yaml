apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-c
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-c
  template:
    metadata:
      labels:
        app: agent-c
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: ["agent-b"]
                topologyKey: kubernetes.io/hostname
      containers:
        - name: agent-c
          image: agent-c-worker:v3
          imagePullPolicy: IfNotPresent
          env:
            - name: NATS_SERVERS
              value: "nats://nats:4222"
            - name: NATS_JETSTREAM_DOMAIN
              value: "__EDGE_CLUSTER_ID__"
            - name: NATS_WORKFLOW_STREAM_PREFIX
              value: "WF"
            - name: NATS_STREAM_MAX_BYTES
              value: "512MiB"
            - name: NATS_STREAM_DISCARD
              value: "new"
            - name: NATS_STREAM_RETENTION
              value: "workqueue"
            - name: CLUSTER_ID
              value: "__EDGE_CLUSTER_ID__"
            - name: AGENT_ID
              value: "c"
            - name: AGENT_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NATS_STREAM_PROVISION_TIMEOUT_SEC
              value: "120"
            - name: NATS_CONTROL_MAX_BYTES
              value: "1048576"
            - name: NATS_BINARY_MAX_BYTES
              value: "67108864"
            - name: NATS_PENDING_SIZE_BYTES
              value: "134217728"
            - name: NATS_BINARY_PENDING_BYTES
              value: "134217728"
            - name: NATS_BINARY_PENDING_MSGS
              value: "32"
            - name: NATS_MAX_INFLIGHT
              value: "4"
            - name: NATS_ACK_PROGRESS_INTERVAL_SEC
              value: "10"
            - name: FRAME_ALLOWED_TARGETS
              value: "agent-grpc:50051"
            - name: FRAME_DOWNLOAD_DIR
              value: "/var/lib/agent-frame-downloads"
            - name: FRAME_DOWNLOAD_TIMEOUT_SEC
              value: "120"
            - name: FRAME_MAX_CHUNK_BYTES
              value: "2097152"
            - name: FRAME_DELETE_AFTER_PROCESS
              value: "true"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: frame-downloads
              mountPath: /var/lib/agent-frame-downloads
      volumes:
        - name: frame-downloads
          emptyDir:
            sizeLimit: 512Mi
