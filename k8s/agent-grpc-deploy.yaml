apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-grpc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-grpc
  template:
    metadata:
      labels:
        app: agent-grpc
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: ["agent-b"]
                topologyKey: kubernetes.io/hostname
      containers:
        - name: agent-grpc
          image: agent-grpc:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: NATS_SERVERS
              value: "nats://nats:4222"
            - name: NATS_JETSTREAM_DOMAIN
              value: "hub"
            - name: NATS_STREAM_SUBJECTS
              value: "workflow.>"
            - name: CLUSTER_ID
              value: "__EDGE_CLUSTER_ID__"
            - name: REQ_SUBJECT
              value: "workflow.__EDGE_CLUSTER_ID__.agent.b.in"
            - name: NATS_CONTROL_MAX_BYTES
              value: "1048576"
            - name: NATS_BINARY_MAX_BYTES
              value: "67108864"
            - name: NATS_PENDING_SIZE_BYTES
              value: "134217728"
            - name: NATS_BINARY_PENDING_BYTES
              value: "134217728"
            - name: NATS_BINARY_PENDING_MSGS
              value: "32"
            - name: WORKFLOW_TIMEOUT_SEC
              value: "120"
            - name: FRAME_PUBLIC_ADDR
              value: "agent-grpc:50051"
            - name: FRAME_STORE_DIR
              value: "/var/lib/agent-frames"
            - name: FRAME_CHUNK_SIZE
              value: "1048576"
            - name: FRAME_MAX_BYTES
              value: "67108864"
            - name: FRAME_STORE_MAX_BYTES
              value: "536870912"
            - name: FRAME_TTL_SECONDS
              value: "300"
            - name: FRAME_MAX_INFLIGHT_UPLOADS
              value: "4"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          ports:
            - containerPort: 50051
          volumeMounts:
            - name: frame-spool
              mountPath: /var/lib/agent-frames
      volumes:
        - name: frame-spool
          emptyDir:
            sizeLimit: 1Gi
