apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-b
  template:
    metadata:
      labels:
        app: agent-b
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: ["agent-grpc"]
                topologyKey: kubernetes.io/hostname
      containers:
        - name: agent-b
          image: agent-b-worker:v5
          imagePullPolicy: IfNotPresent
          env:
            - name: NATS_SERVERS
              value: "nats://nats:4222"
            - name: NATS_JETSTREAM_DOMAIN
              value: "__EDGE_CLUSTER_ID__"
            - name: NATS_WORKFLOW_STREAM_PREFIX
              value: "WF"
            - name: NATS_FRAME_STREAM_PREFIX
              value: "FRAME"
            - name: NATS_FRAME_STREAM_MAX_BYTES
              value: "512MiB"
            - name: NATS_FRAME_STREAM_MAX_AGE_SEC
              value: "120"
            - name: NATS_FRAME_ACK_WAIT_SEC
              value: "60"
            - name: NATS_FRAME_MAX_DELIVER
              value: "3"
            - name: NATS_STREAM_MAX_BYTES
              value: "512MiB"
            - name: NATS_STREAM_DISCARD
              value: "new"
            - name: NATS_STREAM_RETENTION
              value: "workqueue"
            - name: CLUSTER_ID
              value: "__EDGE_CLUSTER_ID__"
            - name: AGENT_ID
              value: "b"
            - name: AGENT_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TARGET_C_CLUSTER_ID
              value: "__EDGE_CLUSTER_ID__"
            - name: TARGET_C_AGENT_ID
              value: "c"
            - name: TARGET_C_INSTANCE_ID
              value: "__AGENT_C_INSTANCE_ID__"
            - name: NATS_STREAM_PROVISION_TIMEOUT_SEC
              value: "120"
            - name: NATS_CONTROL_MAX_BYTES
              value: "1048576"
            - name: NATS_BINARY_MAX_BYTES
              value: "67108864"
            - name: NATS_PENDING_SIZE_BYTES
              value: "134217728"
            - name: NATS_BINARY_PENDING_BYTES
              value: "134217728"
            - name: NATS_BINARY_PENDING_MSGS
              value: "32"
            - name: NATS_MAX_INFLIGHT
              value: "4"
            - name: NATS_ACK_PROGRESS_INTERVAL_SEC
              value: "10"
            - name: WORKFLOW_TIMEOUT_SEC
              value: "120"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
