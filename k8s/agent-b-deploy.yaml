apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-b
  template:
    metadata:
      labels:
        app: agent-b
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: ["agent-grpc"]
                topologyKey: kubernetes.io/hostname
      containers:
        - name: agent-b
          image: agent-b-worker:v5
          imagePullPolicy: IfNotPresent
          env:
            - name: NATS_SERVERS
              value: "nats://nats:4222"
            - name: NATS_JETSTREAM_DOMAIN
              value: "hub"
            - name: NATS_STREAM_SUBJECTS
              value: "workflow.>"
            - name: CLUSTER_ID
              value: "__EDGE_CLUSTER_ID__"
            - name: IN_SUBJECT
              value: "workflow.__EDGE_CLUSTER_ID__.agent.b.in"
            - name: C_IN_SUBJECT
              value: "workflow.__EDGE_CLUSTER_ID__.agent.c.in"
            - name: NATS_CONTROL_MAX_BYTES
              value: "1048576"
            - name: NATS_BINARY_MAX_BYTES
              value: "67108864"
            - name: NATS_PENDING_SIZE_BYTES
              value: "134217728"
            - name: NATS_BINARY_PENDING_BYTES
              value: "134217728"
            - name: NATS_BINARY_PENDING_MSGS
              value: "32"
            - name: NATS_MAX_INFLIGHT
              value: "4"
            - name: NATS_ACK_PROGRESS_INTERVAL_SEC
              value: "10"
            - name: WORKFLOW_TIMEOUT_SEC
              value: "120"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
